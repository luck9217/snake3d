<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viborita 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 20%,
          #06141d 0%,
          #02070c 55%,
          #010304 100%
        );
        font-family: "Consolas", "Courier New", monospace;
        color: #e8ffff;
      }

      #score {
        position: fixed;
        top: 15px;
        left: 15px;
        font-size: 21px;
        letter-spacing: 1px;
        color: #8ffcff;
        text-shadow: 0 0 8px #00eeff;
        z-index: 10;
      }

      #danger {
        position: fixed;
        top: 48px;
        left: 15px;
        font-size: 17px;
        letter-spacing: 1px;
        color: #ff925a;
        text-shadow: 0 0 8px #ff6a00;
        z-index: 10;
      }

      #timer {
        position: fixed;
        right: 18px;
        bottom: 15px;
        font-size: 18px;
        letter-spacing: 1px;
        color: #b2fdff;
        text-shadow: 0 0 8px #00f5ff;
        z-index: 10;
      }

      #resetBtn {
        position: fixed;
        top: 15px;
        right: 15px;
        width: auto;
        height: auto;
        padding: 10px 16px;
        font-size: 14px;
        letter-spacing: 1px;
        border-radius: 8px;
        color: #d6feff;
        background: rgba(0, 222, 255, 0.12);
        border: 1px solid #12d8ef;
        box-shadow: 0 0 12px rgba(0, 225, 255, 0.35);
        cursor: pointer;
        z-index: 10;
      }

      .controls {
        position: fixed;
        bottom: 25px;
        width: 100%;
        text-align: center;
        z-index: 10;
        opacity: 0.88;
      }

      button {
        width: 65px;
        height: 50px;
        margin: 4px;
        font-size: 24px;
        border: 1px solid #00dfef;
        border-radius: 10px;
        background: rgba(0, 180, 220, 0.08);
        color: #aafaff;
        text-shadow: 0 0 8px #00eaff;
        box-shadow: 0 0 8px rgba(0, 225, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="score">Puntos: 0</div>
    <div id="danger">Dragon pasos: 0</div>
    <div id="timer">00:00</div>
    <button id="resetBtn" onclick="resetGame()">Reset</button>

    <div class="controls">
      <div><button onclick="setDir('up')">↑</button></div>
      <div>
        <button onclick="setDir('left')">←</button>
        <button onclick="setDir('down')">↓</button>
        <button onclick="setDir('right')">→</button>
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x01070d);
      scene.fog = new THREE.Fog(0x01070d, 16, 44);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );

      camera.position.set(0, 15, 17);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Luz neon
      const light = new THREE.DirectionalLight(0x6be7ff, 1.5);
      light.position.set(8, 12, 7);
      scene.add(light);

      const backLight = new THREE.DirectionalLight(0x2fc4f2, 0.8);
      backLight.position.set(-10, 5, -8);
      scene.add(backLight);

      const ambient = new THREE.AmbientLight(0x2d5b73, 0.6);
      scene.add(ambient);

      // Grilla / piso
      const gridSize = 20;
      const cellSize = 1;

      const floorGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x02090f,
        emissive: 0x021822,
        emissiveIntensity: 0.55,
        roughness: 0.8,
      });

      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const grid = new THREE.GridHelper(gridSize, gridSize, 0x4cf6ff, 0x0db7d8);
      grid.material.transparent = true;
      grid.material.opacity = 0.92;
      scene.add(grid);

      // Sin columnas decorativas para mantener el mapa limpio.

      // Datos del juego
      let snake = [{ x: 0, z: 0 }];
      let direction = "right";
      let nextDirection = "right";
      let score = 0;
      let gameOver = false;
      let dangerCounter = 0;
      let elapsedSeconds = 0;
      let startTime = Date.now();

      let food = randomFood();
      let dragonCell = { x: 0, z: 0 };
      let lastDragonCell = { x: 999, z: 999 };

      const snakeMeshes = [];
      let foodMesh;
      let dragon;
      let dragonHead;
      let dragonJaw;
      let dragonTail;
      let dragonWingL;
      let dragonWingR;
      let dragonWingBoneL;
      let dragonWingBoneR;
      let dragonLegs = [];
      let dragonSpikes = [];
      let dragonBellyPlates = [];
      let dragonPrevPos = { x: 0, z: 0 };
      let dragonAngle = 0;
      const dragonRadius = 7;
      const dragonSpeed = 0.018;
      let gameTickMs = 250;
      const minGameTickMs = 95;
      const speedStepMs = 8;
      let gameLoopId;

      // Materiales
      const snakeMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff66 });
      snakeMaterial.color.setHex(0x3df4ff);
      snakeMaterial.emissive = new THREE.Color(0x00d8ff);
      snakeMaterial.emissiveIntensity = 0.7;
      snakeMaterial.roughness = 0.28;

      const headMaterial = new THREE.MeshStandardMaterial({
        color: 0xd6ffff,
        emissive: 0x6af8ff,
        emissiveIntensity: 0.95,
        roughness: 0.22,
      });

      const foodMaterial = new THREE.MeshStandardMaterial({
        color: 0x95ffff,
        emissive: 0x00f7ff,
        emissiveIntensity: 1.2,
        roughness: 0.15,
      });
      const dragonMaterial = new THREE.MeshStandardMaterial({
        color: 0x556b34,
        emissive: 0x18220d,
        emissiveIntensity: 0.22,
        roughness: 0.95,
        metalness: 0.02,
        flatShading: true,
      });
      const dragonDetailMaterial = new THREE.MeshStandardMaterial({
        color: 0x30451f,
        emissive: 0x10190a,
        roughness: 1,
        metalness: 0,
        flatShading: true,
      });
      const dragonWingMaterial = new THREE.MeshStandardMaterial({
        color: 0x743144,
        emissive: 0x240f18,
        emissiveIntensity: 0.2,
        roughness: 1,
        metalness: 0,
        flatShading: true,
        side: THREE.DoubleSide,
      });
      const dragonBellyMaterial = new THREE.MeshStandardMaterial({
        color: 0xb4a074,
        emissive: 0x201a10,
        emissiveIntensity: 0.12,
        roughness: 1,
        metalness: 0,
        flatShading: true,
      });

      function createDragon() {
        const group = new THREE.Group();
        dragonLegs = [];
        dragonSpikes = [];
        dragonBellyPlates = [];

        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.45, 0.6, 2.2, 6),
          dragonMaterial,
        );
        body.rotation.z = Math.PI / 2;
        body.position.y = 0.62;
        group.add(body);

        for (let i = 0; i < 4; i++) {
          const plate = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 0.12, 0.32),
            dragonBellyMaterial,
          );
          plate.position.set(0.72 - i * 0.45, 0.35, 0);
          group.add(plate);
          dragonBellyPlates.push(plate);
        }

        const bodyRear = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.45, 1.3, 6),
          dragonMaterial,
        );
        bodyRear.rotation.z = Math.PI / 2;
        bodyRear.position.set(-1.0, 0.56, 0);
        group.add(bodyRear);

        const neck = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.24, 0.9, 5),
          dragonMaterial,
        );
        neck.rotation.z = Math.PI / 2;
        neck.position.set(0.84, 0.8, 0);
        group.add(neck);

        dragonHead = new THREE.Mesh(
          new THREE.ConeGeometry(0.3, 0.9, 5),
          dragonMaterial,
        );
        dragonHead.rotation.z = -Math.PI / 2;
        dragonHead.position.set(1.45, 0.88, 0);
        group.add(dragonHead);

        const snout = new THREE.Mesh(
          new THREE.ConeGeometry(0.14, 0.48, 5),
          dragonMaterial,
        );
        snout.rotation.z = -Math.PI / 2;
        snout.position.set(1.8, 0.8, 0);
        group.add(snout);

        dragonJaw = new THREE.Mesh(
          new THREE.BoxGeometry(0.42, 0.08, 0.26),
          dragonDetailMaterial,
        );
        dragonJaw.position.set(1.62, 0.65, 0);
        group.add(dragonJaw);

        const eyeGeometry = new THREE.SphereGeometry(0.06, 6, 6);
        const eyeMaterial = new THREE.MeshStandardMaterial({
          color: 0xf0ea56,
          emissive: 0x665a12,
          emissiveIntensity: 0.5,
          flatShading: true,
        });

        const eyeL = new THREE.Mesh(eyeGeometry, eyeMaterial);
        eyeL.position.set(1.52, 0.9, 0.17);
        group.add(eyeL);

        const eyeR = new THREE.Mesh(eyeGeometry, eyeMaterial);
        eyeR.position.set(1.52, 0.9, -0.17);
        group.add(eyeR);

        const horn = new THREE.Mesh(
          new THREE.ConeGeometry(0.07, 0.28, 5),
          new THREE.MeshStandardMaterial({
            color: 0xc9c9c9,
            roughness: 1,
            metalness: 0,
            flatShading: true,
          }),
        );
        horn.rotation.z = -Math.PI / 2;
        horn.position.set(1.55, 1.08, 0.16);
        group.add(horn);

        const horn2 = horn.clone();
        horn2.position.z = -0.16;
        group.add(horn2);

        dragonTail = new THREE.Mesh(
          new THREE.ConeGeometry(0.22, 1.6, 6),
          dragonMaterial,
        );
        dragonTail.rotation.z = Math.PI / 2;
        dragonTail.position.set(-1.95, 0.56, 0);
        group.add(dragonTail);

        const wingGeom = new THREE.BufferGeometry();
        const wingVertices = new Float32Array([
          0, 0, 0, 1.35, 0.58, 0, 0.25, 0.95, 0, 1.35, 0.58, 0, 1.8, -0.18, 0,
          0.25, 0.95, 0,
        ]);
        wingGeom.setAttribute(
          "position",
          new THREE.BufferAttribute(wingVertices, 3),
        );
        wingGeom.computeVertexNormals();

        dragonWingL = new THREE.Mesh(wingGeom, dragonWingMaterial);
        dragonWingL.position.set(0.1, 0.95, 0.56);
        dragonWingL.rotation.y = Math.PI / 2;
        group.add(dragonWingL);

        dragonWingBoneL = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.06, 0.06),
          dragonDetailMaterial,
        );
        dragonWingBoneL.position.set(0.62, 1.02, 0.56);
        group.add(dragonWingBoneL);

        dragonWingR = new THREE.Mesh(wingGeom, dragonWingMaterial);
        dragonWingR.position.set(0.1, 0.95, -0.56);
        dragonWingR.rotation.y = Math.PI / 2;
        dragonWingR.rotation.x = Math.PI;
        group.add(dragonWingR);

        dragonWingBoneR = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.06, 0.06),
          dragonDetailMaterial,
        );
        dragonWingBoneR.position.set(0.62, 1.02, -0.56);
        group.add(dragonWingBoneR);

        const legOffsets = [
          [-0.45, 0.28, 0.28],
          [0.2, 0.28, 0.28],
          [-0.45, 0.28, -0.28],
          [0.2, 0.28, -0.28],
        ];

        legOffsets.forEach((offset) => {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.1, 0.58, 5),
            dragonDetailMaterial,
          );
          leg.position.set(offset[0], offset[1], offset[2]);
          group.add(leg);
          dragonLegs.push(leg);

          const claw = new THREE.Mesh(
            new THREE.ConeGeometry(0.045, 0.13, 4),
            new THREE.MeshStandardMaterial({
              color: 0xd6d6d6,
              roughness: 1,
              metalness: 0,
              flatShading: true,
            }),
          );
          claw.rotation.z = -Math.PI / 2;
          claw.position.set(offset[0] + 0.08, 0.02, offset[2]);
          group.add(claw);
        });

        for (let i = 0; i < 5; i++) {
          const spike = new THREE.Mesh(
            new THREE.ConeGeometry(0.06, 0.2, 4),
            dragonDetailMaterial,
          );
          spike.position.set(-0.75 + i * 0.48, 0.95 - i * 0.08, 0);
          group.add(spike);
          dragonSpikes.push(spike);
        }

        scene.add(group);
        return group;
      }

      function updateDragon() {
        if (!dragon || gameOver) return;

        dragonAngle += dragonSpeed;

        const x = Math.cos(dragonAngle) * dragonRadius;
        const z = Math.sin(dragonAngle) * (dragonRadius - 1.3);
        const flap = Math.sin(Date.now() * 0.014);

        dragon.position.set(x, 0, z);
        dragon.position.y =
          0.08 + Math.abs(Math.sin(Date.now() * 0.003)) * 0.12;

        const vx = x - dragonPrevPos.x;
        const vz = z - dragonPrevPos.z;
        if (Math.abs(vx) > 0.0001 || Math.abs(vz) > 0.0001) {
          dragon.rotation.y = Math.atan2(vx, vz);
        }
        dragonPrevPos = { x, z };

        dragonWingL.rotation.z = 0.14 + flap * 0.45;
        dragonWingR.rotation.z = -0.14 - flap * 0.45;
        dragonWingBoneL.rotation.z = 0.08 + flap * 0.35;
        dragonWingBoneR.rotation.z = -0.08 - flap * 0.35;
        dragonTail.rotation.y = flap * 0.35;
        dragonHead.position.y = 0.88 + Math.sin(Date.now() * 0.006) * 0.04;
        dragonJaw.rotation.z = Math.abs(flap) * 0.18;

        for (let i = 0; i < dragonLegs.length; i++) {
          dragonLegs[i].rotation.x = Math.sin(Date.now() * 0.01 + i) * 0.15;
        }

        for (let i = 0; i < dragonSpikes.length; i++) {
          dragonSpikes[i].rotation.x = Math.sin(Date.now() * 0.008 + i) * 0.08;
        }

        for (let i = 0; i < dragonBellyPlates.length; i++) {
          dragonBellyPlates[i].rotation.z =
            Math.sin(Date.now() * 0.006 + i) * 0.04;
        }

        dragonCell = {
          x: Math.round(dragon.position.x),
          z: Math.round(dragon.position.z),
        };

        if (
          dragonCell.x !== lastDragonCell.x ||
          dragonCell.z !== lastDragonCell.z
        ) {
          dangerCounter++;
          document.getElementById("danger").textContent =
            "Dragon pasos: " + dangerCounter;
          lastDragonCell = { ...dragonCell };
        }
      }

      function createCube(x, z, material) {
        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(x, 0.4, z);
        scene.add(cube);
        return cube;
      }

      function updateTimer() {
        if (gameOver) return;
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const mm = String(Math.floor(elapsedSeconds / 60)).padStart(2, "0");
        const ss = String(elapsedSeconds % 60).padStart(2, "0");
        document.getElementById("timer").textContent = mm + ":" + ss;
      }

      function randomFood() {
        return {
          x: Math.floor(Math.random() * gridSize) - gridSize / 2,
          z: Math.floor(Math.random() * gridSize) - gridSize / 2,
        };
      }

      function drawFood() {
        if (foodMesh) scene.remove(foodMesh);
        foodMesh = createCube(food.x, food.z, foodMaterial);
      }

      function drawSnake() {
        for (const mesh of snakeMeshes) {
          scene.remove(mesh);
        }

        snakeMeshes.length = 0;

        snake.forEach((part, index) => {
          const material = index === 0 ? headMaterial : snakeMaterial;
          const cube = createCube(part.x, part.z, material);
          snakeMeshes.push(cube);
        });
      }

      function updateGame() {
        if (gameOver) return;

        direction = nextDirection;

        const head = { ...snake[0] };

        if (direction === "up") head.z -= 1;
        if (direction === "down") head.z += 1;
        if (direction === "left") head.x -= 1;
        if (direction === "right") head.x += 1;

        const limit = gridSize / 2;

        if (
          head.x < -limit ||
          head.x >= limit ||
          head.z < -limit ||
          head.z >= limit
        ) {
          endGame();
          return;
        }

        if (head.x === dragonCell.x && head.z === dragonCell.z) {
          endGame("Te comio el dragon");
          return;
        }

        for (const part of snake) {
          if (head.x === part.x && head.z === part.z) {
            endGame();
            return;
          }
        }

        snake.unshift(head);

        if (head.x === food.x && head.z === food.z) {
          score++;
          document.getElementById("score").textContent = "Puntos: " + score;
          gameTickMs = Math.max(minGameTickMs, gameTickMs - speedStepMs);
          food = randomFood();
          drawFood();
        } else {
          snake.pop();
        }

        drawSnake();
      }

      function setDir(dir) {
        if (dir === "up" && direction !== "down") nextDirection = "up";
        if (dir === "down" && direction !== "up") nextDirection = "down";
        if (dir === "left" && direction !== "right") nextDirection = "left";
        if (dir === "right" && direction !== "left") nextDirection = "right";
      }

      window.setDir = setDir;

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          resetGame();
          return;
        }

        if (e.key === "ArrowUp") setDir("up");
        if (e.key === "ArrowDown") setDir("down");
        if (e.key === "ArrowLeft") setDir("left");
        if (e.key === "ArrowRight") setDir("right");
      });

      function endGame(reason) {
        gameOver = true;
        const cause = reason ? " | " + reason : "";
        document.getElementById("score").textContent =
          "Game Over - Puntos: " + score + cause + " | Usa Reset";
      }

      function resetGame() {
        snake = [{ x: 0, z: 0 }];
        direction = "right";
        nextDirection = "right";
        score = 0;
        gameOver = false;
        dangerCounter = 0;
        elapsedSeconds = 0;
        startTime = Date.now();
        gameTickMs = 250;

        document.getElementById("score").textContent = "Puntos: 0";
        document.getElementById("danger").textContent = "Dragon pasos: 0";
        document.getElementById("timer").textContent = "00:00";

        food = randomFood();
        lastDragonCell = { x: 999, z: 999 };
        dragonAngle = 0;

        if (dragon) {
          dragon.position.set(dragonRadius, 0.08, 0);
          dragonPrevPos = { x: dragonRadius, z: 0 };
          dragonCell = {
            x: Math.round(dragon.position.x),
            z: Math.round(dragon.position.z),
          };
        }

        drawFood();
        drawSnake();
      }

      window.resetGame = resetGame;

      function runGameLoop() {
        updateGame();
        gameLoopId = setTimeout(runGameLoop, gameTickMs);
      }

      function animate() {
        requestAnimationFrame(animate);

        updateDragon();
        updateTimer();

        // Movimiento suave tipo chase-cam neon
        const target = snake[0] || { x: 0, z: 0 };
        camera.position.x +=
          (target.x * 0.15 +
            Math.sin(Date.now() * 0.0007) * 0.8 -
            camera.position.x) *
          0.04;
        camera.position.z += (16 + target.z * 0.16 - camera.position.z) * 0.04;
        camera.lookAt(target.x * 0.35, 0, target.z * 0.35);

        renderer.render(scene, camera);
      }

      drawFood();
      drawSnake();
      dragon = createDragon();
      dragon.position.set(dragonRadius, 0.08, 0);
      dragonPrevPos = { x: dragonRadius, z: 0 };
      dragonCell = {
        x: Math.round(dragon.position.x),
        z: Math.round(dragon.position.z),
      };

      clearTimeout(gameLoopId);
      runGameLoop();
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
